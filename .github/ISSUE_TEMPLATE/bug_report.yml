name: 🐛 Bug Report
description: Report unexpected behavior or crashes
title: "[BUG] "
labels: ["bug"]
body:
  - type: input
    id: game-version
    attributes:
      label: Minecraft Version
      description: Version where bug occurs (e.g. 1.20.1)
      placeholder: "1.x.x"
    validations:
      required: true
  - type: input
    id: mod-version
    attributes:
      label: Mod Version
      description: Exact mod version (e.g. 0.0.1)
      placeholder: "x.x.x"
    validations:
      required: true
  - type: dropdown
    id: loader
    attributes:
      label: Mod Loader
      options:
        - Forge
        - Fabric
        - Neoforge
      description: "Select your mod loader"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction Steps
      description: How to trigger this bug
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happens
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs/Screenshots
      description: Paste relevant logs or add screenshots (wrap logs in code blocks)
      placeholder: |
        ```log
        [Paste log here]
        ```
      render: markdown
  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Other useful information
