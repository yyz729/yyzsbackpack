plugins {
    id 'com.github.johnrengelman.shadow'
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath
    forge {
        convertAccessWideners = true
        extraAccessWideners.add loom.accessWidenerPath.get().asFile.name
        mixinConfig "yyzsbackpack.mixins.json"
        mixinConfig "yyzsbackpack.forge.mixins.json"
    }


}
architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    forge "net.minecraftforge:forge:$rootProject.forge_version"

    // Compile against only the API artifact
    compileOnly  "top.theillusivec4.curios:curios-forge:$rootProject.curios_version:api"
    // Use the full Curios API jar at runtime
    modImplementation "top.theillusivec4.curios:curios-forge:$rootProject.curios_version"
    modImplementation "curse.maven:quark-243121:$rootProject.quark_version"
    modImplementation "curse.maven:zeta-968868:$rootProject.zeta_version"
    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')
    modImplementation   ("curse.maven:jei-238222:4597711")
    modCompileOnly "me.shedaniel:RoughlyEnoughItems-api-forge:$rootProject.rei_version"
    modCompileOnly "me.shedaniel:RoughlyEnoughItems-default-plugin-forge:$rootProject.rei_version"
    modImplementation "curse.maven:inventory-profiles-next-495267:6095062"
    modImplementation "curse.maven:inventorio-forge-497122:6439095"
    modImplementation "curse.maven:gravestone-x-curios-api-compat-1139062:6544424"
    modImplementation "curse.maven:sophisticated-backpacks-422301:6679415"
    modImplementation("curse.maven:applied-energistics-2-223794:6629570")
    modImplementation("curse.maven:sophisticated-core-618298:6680838")

    modImplementation("curse.maven:workshop-for-handsome-adventurer-875843:6707497")

    modImplementation files('libs/SlotCycler-v8.0.1-1.20.1-Forge.jar')

    modImplementation ("curse.maven:inventory-free-406383:4658538")
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}
