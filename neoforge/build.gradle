plugins {
    id 'com.github.johnrengelman.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"


    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')

    compileOnly "top.theillusivec4.curios:curios-neoforge:$rootProject.curios_version"
    compileOnly "top.theillusivec4.curios:curios-neoforge:$rootProject.curios_version:api"
    modCompileOnly "me.shedaniel:RoughlyEnoughItems-api-neoforge:$rootProject.rei_version"
    modCompileOnly "me.shedaniel:RoughlyEnoughItems-default-plugin-neoforge:$rootProject.rei_version"
    modCompileOnly files('libs/durabilityviewer-1.11.0-neoforge-1.21.1.jar')
    modCompileOnly "curse.maven:accessories-938917:6549393"
    modCompileOnly files('libs/hotbarslotcycling-neoforge-21.1.1.jar')
    modCompileOnly files('libs/workshop_for_handsome_adventurer--mc1.21.1--neoforge--1.33.1.jar')
    modCompileOnly "curse.maven:applied-energistics-2-223794:6626602"
    modCompileOnly "curse.maven:inventory-free-406383:5596749"
//    implementation "curse.maven:apotheosis-313970:6545942"
    modCompileOnly "curse.maven:apothic-attributes-898963:6751650"
//    implementation("de.mari_023:ae2wtlib_api:19.2.3")
//    runtimeOnly("de.mari_023:ae2wtlib:19.2.3")
    modCompileOnly "curse.maven:applied-energistics-2-wireless-terminals-459929:6437277"
    modCompileOnly "curse.maven:configurable-keepinventory-960027:6596286"
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}
